    </filter>
  </defs>

  <line x1="190" y1="72" x2="520" y2="72" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="680" y1="72" x2="1010" y2="72" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="520" cy="72" r="2.2" fill="#0D9488">
