      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="6s" begin="1s" repeatCount="indefinite"/>
